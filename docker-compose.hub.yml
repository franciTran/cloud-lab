services:
  backend:
    image: francit/mern-backend:1.0
    container_name: mern-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=5000

  frontend:
    image: francit/mern-frontend:1.0
    container_name: mern-frontend-hub
    restart: unless-stopped
    ports:
      - "3000:80"
    extra_hosts:
      - "mern-backend:host-gateway"
    depends_on:
      - backend